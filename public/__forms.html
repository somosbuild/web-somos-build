<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formularios</title></head>
<body>
  <!-- Netlify Forms detecta este formulario en el deploy. La landing envía por fetch a esta ruta. -->
  <form name="registro" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field">
    <input name="nombre">
    <input name="correo" type="email">
    <input name="etapa">
    <textarea name="comentario"></textarea>
  </form>
  <form name="camp-interes" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field">
    <input name="nombre">
    <input name="whatsapp" type="tel">
    <input name="email" type="email">
    <input name="plan">
    <input name="ninos">
    <input name="pago">
    <input name="nino1_nombre">
    <input name="nino1_edad">
    <input name="nino1_grupo">
    <input name="nino2_nombre">
    <input name="nino2_edad">
    <input name="nino2_grupo">
    <input name="nino3_nombre">
    <input name="nino3_edad">
    <input name="nino3_grupo">
  </form>
</body>
</html>
