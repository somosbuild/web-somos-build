<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formularios</title></head>
<body>
  <!-- Netlify Forms detecta este formulario en el deploy. La landing envía por fetch a esta ruta. -->
  <form name="registro" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field">
    <input name="nombre">
    <input name="correo" type="email">
    <input name="etapa">
    <textarea name="comentario"></textarea>
  </form>
  <form name="camp-interes" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field">
    <input name="nombre">
    <input name="whatsapp" type="tel">
    <input name="email" type="email">
    <input name="plan">
    <input name="semanas">
    <input name="dia">
    <input name="ninos">
    <input name="pago">
    <input name="nino1_nombre">
    <input name="nino1_edad">
    <input name="nino1_grupo">
    <input name="nino2_nombre">
    <input name="nino2_edad">
    <input name="nino2_grupo">
    <input name="nino3_nombre">
    <input name="nino3_edad">
    <input name="nino3_grupo">
  </form>
  <!-- Formularios del camp que la familia dejó a medias (no se envía correo ni va a Notion). -->
  <form name="camp-incompleto" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field">
    <input name="nombre">
    <input name="whatsapp" type="tel">
    <input name="email" type="email">
    <input name="plan">
    <input name="ninos">
    <input name="ninos_detalle">
    <input name="total">
    <input name="faltaba">
    <input name="momento">
  </form>
  <!-- Ficha de ingreso (/welcome-form): datos médicos, emergencia y autorizados a retirar. -->
  <form name="camp-ficha" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field">
    <input name="nombre">
    <input name="whatsapp" type="tel">
    <input name="email" type="email">
    <input name="nino1_nombre">
    <input name="nino1_nacimiento">
    <textarea name="nino1_alergias"></textarea>
    <textarea name="nino1_condiciones"></textarea>
    <input name="nino2_nombre">
    <input name="nino2_nacimiento">
    <textarea name="nino2_alergias"></textarea>
    <textarea name="nino2_condiciones"></textarea>
    <input name="nino3_nombre">
    <input name="nino3_nacimiento">
    <textarea name="nino3_alergias"></textarea>
    <textarea name="nino3_condiciones"></textarea>
    <input name="emergencia_nombre">
    <input name="emergencia_telefono">
    <input name="emergencia_parentesco">
    <input name="retira1_nombre">
    <input name="retira1_cedula">
    <input name="retira2_nombre">
    <input name="retira2_cedula">
    <input name="retira3_nombre">
    <input name="retira3_cedula">
    <input name="fotos">
    <input name="acepto">
  </form>
</body>
</html>
